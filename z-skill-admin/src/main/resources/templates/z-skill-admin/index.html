<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>z-skill 控制台</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 24px; color: #1f2328; }
  h1 { font-size: 18px; margin-bottom: 16px; }
  .card { border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  .kv { display: flex; gap: 16px; flex-wrap: wrap; }
  .kv span { background: #f6f8fa; padding: 4px 10px; border-radius: 4px; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 10px; border-bottom: 1px solid #eaeef2; text-align: left; }
  th { background: #f6f8fa; }
  .installed { color: #1a7f37; font-weight: bold; }
</style>
</head>
<body>
<h1>z-skill 控制台</h1>

<div class="card">
  <div class="kv">
    <span>平台: z-skill 0.1.0</span>
    <span>状态: UP</span>
    <span>Skill 总数: <span id="skill-count">—</span></span>
    <span>已安装: <span id="installed-count">—</span></span>
    <span>分类数: <span id="category-count">—</span></span>
  </div>
</div>

<div class="card">
  <h2 style="font-size:14px;margin-top:0">Skill 列表</h2>
  <table id="skills-table"><thead><tr><th>name</th><th>category</th><th>version</th><th>tools</th><th>状态</th><th>description</th></tr></thead><tbody></tbody></table>
</div>

<script>
fetch('/skill/admin/overview').then(r => r.json()).then(d => {
  document.getElementById('skill-count').textContent = d.skillCount;
  document.getElementById('installed-count').textContent = d.installedCount;
  document.getElementById('category-count').textContent = d.categoryCount;
});
fetch('/skill/admin/skills').then(r => r.json()).then(list => {
  const tbody = document.querySelector('#skills-table tbody');
  list.forEach(s => {
    const tr = document.createElement('tr');
    const installed = s.installed ? '<span class="installed">已安装</span>' : '';
    tr.innerHTML = `<td><code>${s.name}</code></td><td>${s.category}</td><td>${s.version}</td><td>${s.toolCount}</td><td>${installed}</td><td>${s.description || ''}</td>`;
    tbody.appendChild(tr);
  });
});
</script>
</body>
</html>
